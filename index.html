<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinyl Player</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">
        <section class="turntable">

            <div class="album-cover">
                <img src="album-cover.jpg" alt="Album Cover">
            </div>

            <div class="vinyl">
                <div class="vinyl-disc">
                    <div class="grooves"></div>
                    <div class="vinyl-reflection"></div>
                    <div class="record-label">
                        <span>eleventwelfth</span>
                        <small>11</small>
                    </div>
                    <div class="center-hole"></div>
                </div>
            </div>

            <div class="tonearm">
                <div class="tonearm-base">
                    <div class="base-ring"></div>
                    <div class="base-center"></div>
                </div>
                <div class="arm">
                    <div class="arm-highlight"></div>
                </div>
                <div class="cartridge">
                    <div class="screw screw-1"></div>
                    <div class="screw screw-2"></div>
                    <div class="needle"></div>
                </div>
            </div>

            <div class="drag-me">
                <span>DRAG ME</span>
                <div class="drag-arrow"></div>
            </div>

            <div class="now-playing">
                <div class="playing-line"></div>
                <div class="playing-label">NOW PLAYING</div>
                <div class="song-title">last here all alone - ACT III : The Return</div>
                <div class="artist-name">eleventwelfth</div>

                <div class="player-controls">
                    <button id="play-pause-btn" class="control-btn">⏸</button>
                    
                    <div class="progress-container">
                        <input type="range" id="seek-bar" value="0" min="0" step="0.1">
                        <div class="time-display">
                            <span id="current-time">0:00</span> / <span id="duration-time">0:00</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="instruction">
                DRAG THE TONEARM TO PLAY
            </div>

            <div class="blue-dot dot-left"></div>
            <div class="blue-dot dot-right"></div>

            <audio id="bg-music" src="lagu.mp3" preload="metadata"></audio>

            <button id="next-btn" class="next-btn hidden">
                Next &rarr;
            </button>

        </section>

<!-- SECTION BIRTHDAY PAGE -->
        <section id="birthday-page" class="birthday-page hidden">
            <div class="card-wrapper">
                <!-- GIF KUCING BERGERAK MENGORBIT/MELAYANG -->
                <img src="kucing.gif" alt="Gift Kucing" class="cat-gift-orbit">

                <!-- KARTU UCAPAN -->
                <div class="birthday-card">
                    <h1 id="typewriter-title"></h1>
                    <p id="typewriter-text"></p>
                    
                    <button id="back-btn" class="back-btn hidden">&larr; Kembali ke Vinyl</button>
                </div>
            </div>
        </section>
        </main>

    <script src="script.js"></script>
</body>

</html>
